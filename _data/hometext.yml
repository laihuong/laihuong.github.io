    - text: <p class="align-justify"><a href="" class="box-news box-news-date">09/2026</a> We have submitted the thesis manuscript, “Coevolution and Functional Diversification of the TRF2–Apollo Interaction in Jawed Vertebrates,” through ADUM. An article with the same title is currently being submitted to EMBO Reports.
    - text: <p class="align-justify"><a href="" class="box-news box-news-date">09/2025</a>  We published at <a href="https://www.cell.com/cell-reports/fulltext/S2211-1247(25)01031-9">Cell Reports</a>, a paper entitled <a href="https://www.cell.com/cell-reports/fulltext/S2211-1247(25)01031-9"><strong> "TELS1 stabilizes t-loops independently of TRF2 and controls telomere length in pluripotent cells" </strong>. </a> </p>
    - text: <p class="align-justify"><a href="" class="box-news box-news-date">05/2024</a>  We presented at <a href="https://meetings.embo.org/event/24-telomere">EMBO Rome workshop and EMBO Nice workshop</a>, our poster entitled "Functional Diversification of the TRF2–Apollo Interaction in selected species" </strong>.</a></p>
